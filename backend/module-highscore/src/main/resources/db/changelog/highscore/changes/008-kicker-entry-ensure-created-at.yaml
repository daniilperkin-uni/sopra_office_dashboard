databaseChangeLog:

  - changeSet:
      id: 008-kicker-entry-ensure-created-at
      author: st192994
      preConditions:
        onFail: MARK_RAN
        and:
          - tableExists:
              tableName: kicker_entry
          - not:
              columnExists:
                tableName: kicker_entry
                columnName: created_at
      changes:
        - addColumn:
            tableName: kicker_entry
            columns:
              - column:
                  name: created_at
                  type: DATETIME(6)
                  constraints:
                    nullable: true

  - changeSet:
      id: 008-kicker-entry-backfill-created-at-from-entry-date
      author: st192994
      preConditions:
        onFail: MARK_RAN
        and:
          - tableExists:
              tableName: kicker_entry
          - columnExists:
              tableName: kicker_entry
              columnName: created_at
          - columnExists:
              tableName: kicker_entry
              columnName: entry_date
      changes:
        - sql:
            sql: |
              UPDATE kicker_entry
              SET created_at = entry_date
              WHERE created_at IS NULL;

  - changeSet:
      id: 008-kicker-entry-backfill-created-at-now-if-still-null
      author: st192994
      preConditions:
        onFail: MARK_RAN
        and:
          - tableExists:
              tableName: kicker_entry
          - columnExists:
              tableName: kicker_entry
              columnName: created_at
      changes:
        - sql:
            sql: |
              UPDATE kicker_entry
              SET created_at = NOW(6)
              WHERE created_at IS NULL;

  - changeSet:
      id: 008-kicker-entry-created-at-not-null
      author: st192994
      preConditions:
        onFail: MARK_RAN
        and:
          - tableExists:
              tableName: kicker_entry
          - columnExists:
              tableName: kicker_entry
              columnName: created_at
      changes:
        - addNotNullConstraint:
            tableName: kicker_entry
            columnName: created_at
            columnDataType: DATETIME(6)

  - changeSet:
      id: 008-kicker-entry-ensure-match-result
      author: st192994
      preConditions:
        onFail: MARK_RAN
        and:
          - tableExists:
              tableName: kicker_entry
          - not:
              columnExists:
                tableName: kicker_entry
                columnName: match_result
      changes:
        - addColumn:
            tableName: kicker_entry
            columns:
              - column:
                  name: match_result
                  type: VARCHAR(50)
                  constraints:
                    nullable: true

  - changeSet:
      id: 008-kicker-entry-backfill-match-result-default
      author: st192994
      preConditions:
        onFail: MARK_RAN
        and:
          - tableExists:
              tableName: kicker_entry
          - columnExists:
              tableName: kicker_entry
              columnName: match_result
      changes:
        - sql:
            sql: |
              UPDATE kicker_entry
              SET match_result = 'TEAM_A'
              WHERE match_result IS NULL;

  - changeSet:
      id: 008-kicker-entry-match-result-not-null
      author: st192994
      preConditions:
        onFail: MARK_RAN
        and:
          - tableExists:
              tableName: kicker_entry
          - columnExists:
              tableName: kicker_entry
              columnName: match_result
      changes:
        - addNotNullConstraint:
            tableName: kicker_entry
            columnName: match_result
            columnDataType: VARCHAR(50)

  - changeSet:
      id: 008-create-kicker-entry-team-a-table
      author: st192994
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: kicker_entry_team_a_player
      changes:
        - createTable:
            tableName: kicker_entry_team_a_player
            columns:
              - column:
                  name: kicker_entry_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: player_pos
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: player_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: kicker_entry_team_a_player
            columnNames: kicker_entry_id, player_pos
            constraintName: pk_kicker_entry_team_a_player
        - addForeignKeyConstraint:
            baseTableName: kicker_entry_team_a_player
            baseColumnNames: kicker_entry_id
            referencedTableName: kicker_entry
            referencedColumnNames: id
            constraintName: fk_kicker_entry_team_a_entry
            onDelete: CASCADE

  - changeSet:
      id: 008-create-kicker-entry-team-b-table
      author: st192994
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: kicker_entry_team_b_player
      changes:
        - createTable:
            tableName: kicker_entry_team_b_player
            columns:
              - column:
                  name: kicker_entry_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: player_pos
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: player_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: kicker_entry_team_b_player
            columnNames: kicker_entry_id, player_pos
            constraintName: pk_kicker_entry_team_b_player
        - addForeignKeyConstraint:
            baseTableName: kicker_entry_team_b_player
            baseColumnNames: kicker_entry_id
            referencedTableName: kicker_entry
            referencedColumnNames: id
            constraintName: fk_kicker_entry_team_b_entry
            onDelete: CASCADE

  - changeSet:
      id: 008-drop-kicker-entry-fk-match
      author: st192994
      preConditions:
        onFail: MARK_RAN
        and:
          - tableExists:
              tableName: kicker_entry
          - foreignKeyConstraintExists:
              foreignKeyName: fk_kicker_entry_match
      changes:
        - dropForeignKeyConstraint:
            baseTableName: kicker_entry
            constraintName: fk_kicker_entry_match

  - changeSet:
      id: 008-drop-kicker-entry-legacy-player-name
      author: st192994
      preConditions:
        onFail: MARK_RAN
        and:
          - tableExists:
              tableName: kicker_entry
          - columnExists:
              tableName: kicker_entry
              columnName: player_name
      changes:
        - dropColumn:
            tableName: kicker_entry
            columnName: player_name

  - changeSet:
      id: 008-drop-kicker-entry-legacy-entry-date
      author: st192994
      preConditions:
        onFail: MARK_RAN
        and:
          - tableExists:
              tableName: kicker_entry
          - columnExists:
              tableName: kicker_entry
              columnName: entry_date
      changes:
        - dropColumn:
            tableName: kicker_entry
            columnName: entry_date

  - changeSet:
      id: 008-drop-kicker-entry-legacy-points
      author: st192994
      preConditions:
        onFail: MARK_RAN
        and:
          - tableExists:
              tableName: kicker_entry
          - columnExists:
              tableName: kicker_entry
              columnName: points
      changes:
        - dropColumn:
            tableName: kicker_entry
            columnName: points

  - changeSet:
      id: 008-drop-kicker-entry-legacy-match-id
      author: st192994
      preConditions:
        onFail: MARK_RAN
        and:
          - tableExists:
              tableName: kicker_entry
          - columnExists:
              tableName: kicker_entry
              columnName: match_id
      changes:
        - dropColumn:
            tableName: kicker_entry
            columnName: match_id