databaseChangeLog:
  - changeSet:
      id: 004-rename-darts-column
      author: st192994
      preConditions:
        onFail: MARK_RAN
        columnExists:
          tableName: darts_entry
          columnName: employee_name
        not:
          columnExists:
            tableName: darts_entry
            columnName: player_name
      changes:
        - renameColumn:
            tableName: darts_entry
            oldColumnName: employee_name
            newColumnName: player_name
            columnDataType: VARCHAR(255)

  - changeSet:
      id: 004-cleanup-darts-column
      author: st192994
      preConditions:
        onFail: MARK_RAN
        and:
          - columnExists:
              tableName: darts_entry
              columnName: employee_name
          - columnExists:
              tableName: darts_entry
              columnName: player_name
      changes:
        # Optional: migrate data if needed, but for now just drop to fix schema
        - sql: UPDATE darts_entry SET player_name = employee_name WHERE player_name IS NULL
        - dropColumn:
            tableName: darts_entry
            columnName: employee_name

  - changeSet:
      id: 004-rename-kicker-result
      author: st192994
      preConditions:
        onFail: MARK_RAN
        columnExists:
          tableName: kicker_match
          columnName: winner_team
        not:
          columnExists:
            tableName: kicker_match
            columnName: match_result
      changes:
        - renameColumn:
            tableName: kicker_match
            oldColumnName: winner_team
            newColumnName: match_result
            columnDataType: VARCHAR(50)

  - changeSet:
      id: 004-cleanup-kicker-result
      author: st192994
      preConditions:
        onFail: MARK_RAN
        and:
          - columnExists:
              tableName: kicker_match
              columnName: winner_team
          - columnExists:
              tableName: kicker_match
              columnName: match_result
      changes:
        - sql: UPDATE kicker_match SET match_result = winner_team WHERE match_result IS NULL
        - dropColumn:
            tableName: kicker_match
            columnName: winner_team

  - changeSet:
      id: 004-drop-kicker-teamA-p1
      author: st192994
      preConditions:
        onFail: MARK_RAN
        columnExists:
          tableName: kicker_match
          columnName: teamA_player1_name
      changes:
        - dropColumn:
            tableName: kicker_match
            columnName: teamA_player1_name

  - changeSet:
      id: 004-drop-kicker-teamA-p2
      author: st192994
      preConditions:
        onFail: MARK_RAN
        columnExists:
          tableName: kicker_match
          columnName: teamA_player2_name
      changes:
        - dropColumn:
            tableName: kicker_match
            columnName: teamA_player2_name

  - changeSet:
      id: 004-drop-kicker-teamB-p1
      author: st192994
      preConditions:
        onFail: MARK_RAN
        columnExists:
          tableName: kicker_match
          columnName: teamB_player1_name
      changes:
        - dropColumn:
            tableName: kicker_match
            columnName: teamB_player1_name

  - changeSet:
      id: 004-drop-kicker-teamB-p2
      author: st192994
      preConditions:
        onFail: MARK_RAN
        columnExists:
          tableName: kicker_match
          columnName: teamB_player2_name
      changes:
        - dropColumn:
            tableName: kicker_match
            columnName: teamB_player2_name

  - changeSet:
      id: 004-create-kicker-team-a-table
      author: st192994
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: kicker_match_team_a_player
      changes:
        - createTable:
            tableName: kicker_match_team_a_player
            columns:
              - column:
                  name: kicker_match_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: player_pos
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: player_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: kicker_match_team_a_player
            columnNames: kicker_match_id, player_pos
            constraintName: pk_kicker_match_team_a_player
        - addForeignKeyConstraint:
            baseTableName: kicker_match_team_a_player
            baseColumnNames: kicker_match_id
            referencedTableName: kicker_match
            referencedColumnNames: id
            constraintName: fk_kicker_team_a_match
            onDelete: CASCADE

  - changeSet:
      id: 004-create-kicker-team-b-table
      author: st192994
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: kicker_match_team_b_player
      changes:
        - createTable:
            tableName: kicker_match_team_b_player
            columns:
              - column:
                  name: kicker_match_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: player_pos
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: player_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: kicker_match_team_b_player
            columnNames: kicker_match_id, player_pos
            constraintName: pk_kicker_match_team_b_player
        - addForeignKeyConstraint:
            baseTableName: kicker_match_team_b_player
            baseColumnNames: kicker_match_id
            referencedTableName: kicker_match
            referencedColumnNames: id
            constraintName: fk_kicker_team_b_match
            onDelete: CASCADE
