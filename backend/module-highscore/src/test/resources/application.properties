spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate für H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Liquibase für Tests deaktivieren (optional)
spring.liquibase.enabled=false

# Cache deaktivieren
spring.cache.type=none

odoo.api.url=https://odoo15studentproject.dev.itestra.com
odoo.api.db=itestraodoo
odoo.api.username=admin
odoo.api.password=REDACTED-SECRET
odoo.api.work-location=Stuttgart

# Mattermost
