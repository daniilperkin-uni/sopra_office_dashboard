spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate für H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Liquibase für Tests deaktivieren (optional)
spring.liquibase.enabled=false

# Cache deaktivieren
spring.cache.type=none

# Odoo (placeholder values for tests; no real credentials here)
odoo.api.url=https://odoo.example.test
odoo.api.db=testdb
odoo.api.username=test
odoo.api.password=test
odoo.api.work-location=Stuttgart

# Mattermost (placeholder values for tests; no real credentials here)
mattermost.api.url=https://mattermost.example.test/api/v4
mattermost.api.token=REDACTED-SECRET
mattermost.api.channelId=test-channel

# Admin credentials (tests use a fixed password)
admin.username=admin
admin.password=REDACTED-SECRET

# Disable notifications/schedulers during tests
notifications.events.enabled=false
events.cache.refresh.schedule.cron=0 0 3 30 2 ?
past.parking.entries.remove.cron=0 0 3 30 2 ?

# Variables for module-parking
maximumParkingSpots=5
numberOfWorkingDays=10
