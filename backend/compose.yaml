services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      SERVER_PORT: ${DASHBOARD_PORT:-8080}
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-test}
      DB_USER: ${DB_USER:-myuser}
      DB_PASS: ${DB_PASS:?DB_PASS must be set in .env}
      DB_ROOT_PASS: ${DB_ROOT_PASS:?DB_ROOT_PASS must be set in .env}
    ports:
      - "8099:8080"
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      # /actuator/health ist in SecurityConfig ohne Anmeldung erreichbar.
      # Das JRE-Image bringt weder curl noch wget mit, bash kann aber direkt
      # ueber /dev/tcp eine HTTP-Anfrage stellen - so bleibt das Image schlank.
      test:
        - "CMD-SHELL"
        - "bash -c 'exec 3<>/dev/tcp/127.0.0.1/$${SERVER_PORT:-8080}; printf \"GET /actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3; grep -q 200 <&3'"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_ANONYMIZE_NAMES: ${VITE_ANONYMIZE_NAMES:-false} 
    ports:
      - "8098:80"
    depends_on:
      - backend

  mariadb:
    image: mariadb:latest
    env_file:
      - .env
    environment:
      MARIADB_DATABASE: ${DB_NAME:-test}
      MARIADB_USER: ${DB_USER:-myuser}
      MARIADB_PASSWORD: ${DB_PASS:?DB_PASS must be set in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS:?DB_ROOT_PASS must be set in .env}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      # Das Passwort kommt aus der Container-Umgebung; auf der Kommandozeile
      # waere es ueber 'ps' und 'docker inspect' sichtbar.
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p\"$$MARIADB_ROOT_PASSWORD\" --silent"]
      timeout: 5s
      retries: 10
      interval: 5s
      # MariaDB braucht beim ersten Start Zeit fuer die Initialisierung, bevor
      # der Healthcheck sinnvoll greifen kann.
      start_period: 30s

volumes:
  mariadb_data:
