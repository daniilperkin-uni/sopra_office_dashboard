spring.application.name=backend
server.port=${ITESTRA_DASHBOARD_PORT:8080}

# MariaDB Datasource
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:test}
spring.datasource.username=${DB_USER:myuser}
spring.datasource.password=${DB_PASS:secret}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Admin credentials (rotate via env vars — see .env.example)
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD}

# CORS — comma-separated list of allowed origins for the admin UI
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8098}

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Odoo (secrets via environment variables — see .env.example)
odoo.api.url=${ODOO_API_URL:https://odoo15studentproject.dev.itestra.com}
odoo.api.db=${ODOO_API_DB:itestraodoo}
odoo.api.username=${ODOO_API_USERNAME:admin}
odoo.api.password=${ODOO_API_PASSWORD}
odoo.api.work-location=Stuttgart

# Mattermost (secrets via environment variables — see .env.example)
mattermost.api.url=${MATTERMOST_API_URL:https://mattermost.itestra.com/api/v4}
mattermost.api.token=${MATTERMOST_API_TOKEN}
mattermost.api.channelId=${MATTERMOST_API_CHANNEL_ID}

# Event Notifications
# Enable or disable scheduled event reminder notifications
notifications.events.enabled=true
# Cron expression for notification schedule (default: daily at 12:00 noon)
# Format: second minute hour day-of-month month day-of-week
notifications.events.schedule.cron=0 0 12 * * *

# Cron expression for events cache refresh schedule (default: every hour at minute 12)
events.cache.refresh.schedule.cron=0 12 * * * *

# Cron expression for schedule of deleting parking entries from yesterday (default: daily at 00:00)
past.parking.entries.remove.cron=0 0 0 * * *

# Variables for module-parking
maximumParkingSpots=5
numberOfWorkingDays=10

