/**
 * The 'common' module provides cross-cutting infrastructure shared by
 * module-events and module-community-lunches:
 *   - NotificationSender interface
 *   - MattermostClient + MattermostNotificationSender
 *   - DateTimeFormatterConstants
 *
 * It intentionally does NOT depend on JPA, MariaDB, or Liquibase.
 */
plugins {
    id 'java'
}

group = 'de.office.dashboard'
version = '0.0.1-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // Spring dependencies for MattermostClient (WebClient)
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework:spring-context'

    // JUnit for testing. The BOM keeps jupiter and the platform
    // (engine + launcher) on aligned versions - a hardcoded 5.10.0 without the
    // launcher made Gradle's newer test launcher fail discovery with
    // 'OutputDirectoryProvider not available'.
    testImplementation platform('org.junit:junit-bom:5.12.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.14.2'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

test {
    useJUnitPlatform()
}

jar {
    enabled = true
}