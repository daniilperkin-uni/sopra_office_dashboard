dependencies {
    implementation project(':common')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui'
    // OdooClient talks XML-RPC directly; this was previously pulled in
    // transitively by com.odoojava:odoo-java-api, which only resolves from an
    // external Nexus and is otherwise unused.
    implementation 'org.apache.xmlrpc:xmlrpc-client:3.1.3'

    // Use Spring Boot's unified JUnit setup
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // Align launcher version to Spring Boot's JUnit platform

    implementation "org.springframework.boot:spring-boot-starter-webflux"
    testImplementation project(':backend')
}

test {
    useJUnitPlatform()
}

jar {
    enabled = true
}
