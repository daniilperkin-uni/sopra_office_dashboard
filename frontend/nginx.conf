# Definiert einen virtuellen Server, der auf Port 80 lauscht.
server {
    listen 80;
    charset utf-8;

    # Verwendet den internen Docker-DNS-Resolver (127.0.0.11).
    # Dies verhindert, dass Nginx abstürzt, wenn der Hostname "backend" beim Start noch nicht aufgelöst werden kann.
    resolver 127.0.0.11 valid=30s;

    # Redirect favicon.ico requests to the actual logo file.
    location = /favicon.ico {
        return 301 /assets/our_logo.png;
    }

    # Dieser Block behandelt alle Anfragen an die Wurzel-URL und andere Pfade, die nicht /api sind.
    # Dies ermöglicht es dem Frontend, mit dem Backend zu kommunizieren, ohne CORS-Probleme.
    location /api {
        # Wir definieren das Backend als Variable, damit Nginx die DNS-Auflösung erst zur Laufzeit durchführt.
        # Dadurch startet der Container auch dann erfolgreich, wenn das Backend noch bootet (Lazy Resolution).
        set $upstream_backend backend;

        # Leitet die Anfrage an den Backend-Service weiter.
        # "backend" ist der Servicename aus der docker-compose.yml.
        # Port 8080 ist der Port, auf dem das Backend im Container läuft.
        proxy_pass http://$upstream_backend:8080;

        # Diese Direktiven setzen Header, um dem Backend Informationen über die ursprüngliche Anfrage zu geben.
        # Dies ist wichtig, damit das Backend die echte IP-Adresse des Clients und andere Details kennt.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Content-Type-Options "nosniff";
    }

    # Explicitly serve assets from the /assets directory
    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
        charset utf-8;
    }

    # Serve the main frontend application
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options "nosniff";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://backend:8080; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com;";
        charset utf-8;
    }
}
